<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Système de gestion de leads avec notifications Telegram automatiques" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lead System" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/genie.jpeg" />
    <link rel="apple-touch-icon" href="/genie.jpeg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <title>Lead System — Dashboard</title>

    <!-- Fonts: Syne (display) + DM Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Skip to main content for keyboard/screen-reader users -->
    <style>
      .skip-link {
        position: absolute;
        top: -100%;
        left: 1rem;
        background: #00e5c3;
        color: #0a0f1e;
        padding: 0.5rem 1rem;
        font-weight: 700;
        z-index: 9999;
        border-radius: 0 0 6px 6px;
        text-decoration: none;
        transition: top 0.2s;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Passer au contenu principal</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
